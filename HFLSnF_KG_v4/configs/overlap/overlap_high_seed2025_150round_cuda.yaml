# V4 entity-overlap ablation configuration derived from the HFLSnF baseline.
common_args:
  training_type: "simulation"
  random_seed: 2025

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"
  partition_strategy: "balanced_head_entity_overlap_target"
  partition_target_entity_overlap: 0.28535945459420126
  partition_overlap_tolerance: 0.005
  partition_load_tolerance: 0.05
  relation_overlap_tolerance: 0.02
  partition_search_seed: 2025
  partition_search_restarts: 8

model_args:
  model: "transe"
  embedding_dim: 256
  distance_norm: 1

train_args:
  # Keep all behavior settings identical to the same-seed HFLSnF baseline.
  federated_optimizer: "DynamicTopologyTransE"
  ablation_suite: "v4_hflsnf_entity_overlap_fedadam_u0p6_e3_eval1_formal150"
  ablation_arm: "overlap_high_seed2025"
  comparison_scenario: "V4-HFLSnF-EntityOverlap-HIGH-Seed2025-Formal150"
  client_num_in_total: 37
  # The MATLAB schedule determines the actual participant count each round.
  client_num_per_round: 37
  topology_type: "matlab_direct"
  topology_architecture: "hfl"
  topology_snf: true
  topology_edge_mode: "fixed"
  edge_num: 6
  dynamic_group_mat_file: "../Topo_opt/postprocess/result-U-6fixedge_epoch200_hard_varAlpha_0p1_trainable.mat"
  topology_util: 0.6
  topology_schedule_policy: "strict"
  aggregation_mode: "row_count_weighted"
  server_optimizer: "fedadam"
  server_learning_rate: 0.05
  server_beta1: 0.9
  server_beta2: 0.99
  server_tau: 0.001
  server_bias_correction: false
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 9.0
  adversarial_temperature: 1.0
  expected_partition_hash: "9a30d5f94e55d10c60c25f83dcd6069ce7a8039538543db6357eeed9fc29f256"
  expected_topology_schedule_hash: "e383d1c5727c9541a8ea5df105c4a1ce93590b4ce6a6956ffe2bfaf93e2f84fe"
  comm_round: 150
  epochs: 3
  batch_size: 1024
  client_optimizer: "adam"
  client_optimizer_state_mode: "reset"
  learning_rate: 0.00005
  lr: 0.00005
  margin: 1.0
  negative_sample_count: 256
  eval_every: 1
  validation_max_triples: 4096
  validation_selection: "relation_stratified"
  final_validation_max_triples: 4096
  test_max_triples: 0
  # Defer test evaluation until validation-only selection is complete.
  evaluate_test_after_training: false
  evaluation_query_batch_size: 64
  evaluation_candidate_batch_size: 8192
  profile_training_timing: false

device_args:
  using_gpu: true
  require_cuda: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v4_entity_overlap_high_seed2025_150round_cuda"
  result_root: "results"

