# Final stochastic-topology FedAdam configuration using a MATLAB-mean budget profile.
common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 256
  distance_norm: 1

train_args:
  # Keep all training settings aligned with the final dynamic-topology runs.
  federated_optimizer: "DynamicTopologyTransE"
  ablation_suite: "v3_final_stochastic_fedadam_matmean_profiles_e3_eval1_formal150"
  ablation_arm: "final_stochastic_flnosnf_profile_seed42"
  comparison_scenario: "V3-FinalStochasticFedAdam-FLnoSnF-profile-Seed42-Formal150"
  client_num_in_total: 37
  # The fixed count is the rounded util=0.6 MATLAB mean for this profile.
  client_num_per_round: 5
  topology_type: "fixed_count"
  fixed_count_selection_mode: "seeded_random"
  fixed_count_grouping_mode: "seeded_random_balanced"
  fixed_count_seed: 42
  topology_architecture: "fl"
  topology_snf: false
  topology_edge_mode: "none"
  # The fixed group count is the rounded util=0.6 MATLAB mean for this profile.
  edge_num: 1
  aggregation_mode: "row_count_weighted"
  server_optimizer: "fedadam"
  server_learning_rate: 0.05
  server_beta1: 0.9
  server_beta2: 0.99
  server_tau: 0.001
  server_bias_correction: false
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 9.0
  adversarial_temperature: 1.0
  expected_partition_hash: "8bcac64b705ec2db8721de6a36130625a460c11e0da46e2c22bd852ff015fb19"
  expected_topology_schedule_hash: "6b90b87b5718e1973c1da9d96a9e0e2cfd726f71c5644d0cb8b937f6e6eaf287"
  comm_round: 150
  epochs: 3
  batch_size: 1024
  client_optimizer: "adam"
  client_optimizer_state_mode: "reset"
  learning_rate: 0.00005
  lr: 0.00005
  margin: 1.0
  negative_sample_count: 256
  eval_every: 1
  validation_max_triples: 4096
  validation_selection: "relation_stratified"
  final_validation_max_triples: 4096
  test_max_triples: 0
  # Defer test evaluation until validation-only selection is complete.
  evaluate_test_after_training: false
  evaluation_query_batch_size: 64
  evaluation_candidate_batch_size: 8192
  profile_training_timing: false

device_args:
  using_gpu: true
  require_cuda: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_final_stochastic_fedadam_flnosnf_profile_seed42_150round_cuda"
  result_root: "results"
