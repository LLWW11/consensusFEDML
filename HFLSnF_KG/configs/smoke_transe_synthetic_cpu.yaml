common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "synthetic-kg"

model_args:
  model: "transe"
  embedding_dim: 16
  distance_norm: 1

train_args:
  federated_optimizer: "CentralizedTransE"
  # 以下三个字段只用于兼容FedML 0.7.600参数解析，阶段三不执行联邦聚合。
  client_num_in_total: 1
  client_num_per_round: 1
  comm_round: 1
  epochs: 3
  batch_size: 4
  learning_rate: 0.01
  lr: 0.01
  margin: 1.0
  negative_sample_count: 1
  eval_every: 1
  validation_max_triples: 0
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 64
  early_stopping_patience: 0

device_args:
  using_gpu: false
  gpu_id: 0
  require_cuda: false

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_transe_synthetic_smoke_cpu"
  result_root: "results"
