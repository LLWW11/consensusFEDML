common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"

model_args:
  model: "transe"
  embedding_dim: 128
  distance_norm: 1

train_args:
  federated_optimizer: "CentralizedTransE"
  # 以下三个字段只用于兼容FedML 0.7.600参数解析，阶段三不执行联邦聚合。
  client_num_in_total: 1
  client_num_per_round: 1
  comm_round: 1
  epochs: 100
  batch_size: 1024
  learning_rate: 0.001
  lr: 0.001
  margin: 1.0
  negative_sample_count: 1
  eval_every: 10
  validation_max_triples: 1000
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 4096
  early_stopping_patience: 5

device_args:
  using_gpu: true
  gpu_id: 0
  require_cuda: true

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_fb15k237_transe_server_cuda"
  result_root: "results"
