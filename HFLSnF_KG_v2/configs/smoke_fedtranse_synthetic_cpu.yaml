common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "synthetic-kg"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 16
  distance_norm: 1

train_args:
  federated_optimizer: "FedAvgTransE"
  client_num_in_total: 3
  client_num_per_round: 3
  comm_round: 2
  epochs: 1
  batch_size: 4
  client_optimizer: "adam"
  learning_rate: 0.01
  lr: 0.01
  margin: 1.0
  negative_sample_count: 1
  eval_every: 1
  validation_max_triples: 0
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 64
  centralized_reference_mrr: 0.3083333333333333

device_args:
  using_gpu: false
  gpu_id: 0
  require_cuda: false

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_fedtranse_synthetic_smoke_cpu"
  result_root: "results"
