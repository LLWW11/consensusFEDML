common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"

model_args:
  model: "transe"
  embedding_dim: 256
  distance_norm: 2

train_args:
  federated_optimizer: "CentralizedTransE"

  client_num_in_total: 1
  client_num_per_round: 1
  comm_round: 1
  epochs: 1000
  batch_size: 1024
  learning_rate: 0.001
  lr: 0.001
  margin: 1.0
  negative_sample_count: 30

  # 每个epoch用小型固定子集打印趋势，不参与最佳模型选择。
  monitor_every_epoch: true
  monitor_validation_max_triples: 10

  # 正式选模仍每5个epoch执行，并使用较大的固定验证子集。
  eval_every: 5
  validation_max_triples: 1000
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 4096
  early_stopping_patience: 20

device_args:
  using_gpu: true
  gpu_id: 0
  require_cuda: true

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_fb15k237_transe_server_cuda"
  result_root: "results"
