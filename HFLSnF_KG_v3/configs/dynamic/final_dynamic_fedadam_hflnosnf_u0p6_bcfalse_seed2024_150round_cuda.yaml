# Final dynamic-topology FedAdam configuration selected from stage two.
common_args:
  training_type: "simulation"
  random_seed: 2024

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 256
  distance_norm: 1

train_args:
  # Keep all behavior settings identical across the final paired runs.
  federated_optimizer: "DynamicTopologyTransE"
  ablation_suite: "v3_final_dynamic_fedadam_u0p6_bcfalse_e3_eval1_formal150"
  ablation_arm: "final_hflnosnf_u0p6_bcfalse_seed2024"
  comparison_scenario: "V3-FinalDynamicFedAdam-HFLNOSNF-u0p6_bcfalse-Seed2024-Formal150"
  client_num_in_total: 37
  # The MATLAB schedule determines the actual participant count each round.
  client_num_per_round: 37
  topology_type: "matlab_direct"
  topology_architecture: "hfl"
  topology_snf: false
  topology_edge_mode: "fixed"
  edge_num: 6
  dynamic_group_mat_file: "../Topo_opt/postprocess/result-U-6fixedge_epoch200_hard_varAlpha_0p1_trainable.mat"
  topology_util: 0.6
  topology_schedule_policy: "strict"
  aggregation_mode: "row_count_weighted"
  server_optimizer: "fedadam"
  server_learning_rate: 0.05
  server_beta1: 0.9
  server_beta2: 0.99
  server_tau: 0.001
  server_bias_correction: false
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 9.0
  adversarial_temperature: 1.0
  expected_partition_hash: "4653f60364e43ad9991ee3393f1a222d665774489b88f0d242ce322107d1b430"
  expected_topology_schedule_hash: "0c7b70472476933389e1b8347a1583dbb0c847ae74a6469704a8cf09d025cabc"
  comm_round: 150
  epochs: 3
  batch_size: 1024
  client_optimizer: "adam"
  client_optimizer_state_mode: "reset"
  learning_rate: 0.00005
  lr: 0.00005
  margin: 1.0
  negative_sample_count: 256
  eval_every: 1
  validation_max_triples: 4096
  validation_selection: "relation_stratified"
  final_validation_max_triples: 4096
  test_max_triples: 0
  # Defer test evaluation until validation-only selection is complete.
  evaluate_test_after_training: false
  evaluation_query_batch_size: 64
  evaluation_candidate_batch_size: 8192
  profile_training_timing: false

device_args:
  using_gpu: true
  require_cuda: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_final_dynamic_fedadam_hflnosnf_u0p6_bcfalse_seed2024_150round_cuda"
  result_root: "results"
