common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "synthetic-kg"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 16
  distance_norm: 1

train_args:
  federated_optimizer: "DynamicTopologyTransE"
  comparison_scenario: "V3-HFLSnF-Smoke"
  client_num_in_total: 3
  client_num_per_round: 3
  topology_type: "static"
  topology_architecture: "hfl"
  topology_snf: false
  topology_edge_mode: "fixed"
  edge_num: 2
  aggregation_mode: "row_mask_presence"
  local_objective: "fede_self_adversarial"
  fede_gamma: 6.0
  adversarial_temperature: 1.0
  comm_round: 2
  epochs: 1
  batch_size: 4
  client_optimizer: "adam"
  learning_rate: 0.01
  lr: 0.01
  margin: 1.0
  negative_sample_count: 2
  eval_every: 1
  validation_max_triples: 4
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 32
  evaluation_query_batch_size: 2
  profile_training_timing: true
  centralized_reference_mrr: 0.0

device_args:
  using_gpu: false
  require_cuda: false
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_hflsnf_smoke_cpu"
  result_root: "results"
