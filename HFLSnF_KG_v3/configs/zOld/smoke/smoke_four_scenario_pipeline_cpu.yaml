common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "synthetic-kg"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 16
  distance_norm: 1

train_args:
  # Two-round CPU smoke for the shared four-scenario training pipeline.
  federated_optimizer: "DynamicTopologyTransE"
  comparison_scenario: "V3-FourScenario-Pipeline-Smoke"
  client_num_in_total: 4
  client_num_per_round: 3
  topology_type: "fixed_count"
  fixed_count_selection_mode: "seeded_round_robin"
  fixed_count_seed: 42
  topology_architecture: "hfl"
  topology_snf: false
  topology_edge_mode: "fixed"
  edge_num: 2
  aggregation_mode: "row_count_weighted"
  server_optimizer: "fedadam"
  server_learning_rate: 0.1
  server_beta1: 0.9
  server_beta2: 0.99
  server_tau: 0.001
  server_bias_correction: false
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 6.0
  adversarial_temperature: 1.0
  comm_round: 2
  epochs: 1
  batch_size: 4
  client_optimizer: "adam"
  client_optimizer_state_mode: "reset"
  learning_rate: 0.01
  lr: 0.01
  margin: 1.0
  negative_sample_count: 2
  eval_every: 1
  validation_max_triples: 4
  validation_selection: "relation_stratified"
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 32
  evaluation_query_batch_size: 2
  profile_training_timing: true
  centralized_reference_mrr: 0.0

device_args:
  using_gpu: false
  require_cuda: false
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_smoke_four_scenario_pipeline_cpu"
  result_root: "results"
