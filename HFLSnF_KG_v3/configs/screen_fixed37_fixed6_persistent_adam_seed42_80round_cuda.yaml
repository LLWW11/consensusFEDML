common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 256
  distance_norm: 1

train_args:
  # Step-2 ablation: only the per-client Adam state changes.
  federated_optimizer: "DynamicTopologyTransE"
  comparison_scenario: "V3-Fixed37-Fixed6-PersistentAdam-Seed42-Screen80"
  client_num_in_total: 37
  client_num_per_round: 37
  topology_type: "static"
  topology_architecture: "hfl"
  topology_snf: false
  topology_edge_mode: "fixed"
  edge_num: 6
  aggregation_mode: "row_count_weighted"
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 9.0
  adversarial_temperature: 1.0
  expected_partition_hash: "8bcac64b705ec2db8721de6a36130625a460c11e0da46e2c22bd852ff015fb19"
  # This hash is identical to the reset-Adam fixed-topology baseline.
  expected_topology_schedule_hash: "69b9d605d4b8fa7da0d1f1900a081966f35ec1ffa84ca3d96baf1047ad25fc9c"
  comm_round: 80
  epochs: 2
  batch_size: 1024
  client_optimizer: "adam"
  # Each client keeps independent Adam moments and step counters.
  client_optimizer_state_mode: "persistent_per_client"
  learning_rate: 0.00005
  lr: 0.00005
  margin: 1.0
  negative_sample_count: 256
  # Keep the validation and pipeline-check protocol unchanged.
  eval_every: 10
  validation_max_triples: 4096
  validation_selection: "relation_stratified"
  final_validation_max_triples: 4096
  test_max_triples: 512
  evaluation_query_batch_size: 64
  evaluation_candidate_batch_size: 8192
  profile_training_timing: false
  centralized_reference_mrr: 0.3869668845438231

device_args:
  using_gpu: true
  require_cuda: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_screen_fixed37_fixed6_persistent_adam_seed42_80round_cuda"
  result_root: "results"
