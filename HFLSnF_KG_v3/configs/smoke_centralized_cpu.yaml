common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "synthetic-kg"

model_args:
  model: "transe"
  embedding_dim: 16
  distance_norm: 1

train_args:
  # FedML参数加载器要求这两个字段；集中式训练本身不会使用客户端。
  client_num_in_total: 1
  client_num_per_round: 1
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 6.0
  adversarial_temperature: 1.0
  epochs: 3
  batch_size: 2
  learning_rate: 0.01
  lr: 0.01
  margin: 1.0
  negative_sample_count: 4
  eval_every: 1
  validation_max_triples: 4
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 32
  evaluation_query_batch_size: 2
  profile_training_timing: true
  early_stopping_patience: 0

device_args:
  using_gpu: false
  require_cuda: false
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_centralized_smoke_cpu"
  result_root: "results"
