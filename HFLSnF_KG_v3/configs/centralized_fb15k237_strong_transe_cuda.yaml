common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"

model_args:
  model: "transe"
  embedding_dim: 256
  distance_norm: 1

train_args:
  # FedML参数加载器要求这两个字段；集中式训练本身不会使用客户端。
  client_num_in_total: 1
  client_num_per_round: 1
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 9.0
  adversarial_temperature: 1.0
  # 380个全量epoch约等于10.1万个1024正样本批次。
  epochs: 380
  batch_size: 1024
  learning_rate: 0.00005
  lr: 0.00005
  margin: 1.0
  negative_sample_count: 256
  eval_every: 20
  validation_max_triples: 4096
  validation_selection: "relation_stratified"
  final_validation_max_triples: 0
  test_max_triples: 0
  # 训练期评估采用与方向诊断一致的批量精确filtered排名。
  evaluation_query_batch_size: 64
  evaluation_candidate_batch_size: 8192
  # 正式训练关闭逐批CUDA同步；需要定位瓶颈时改用benchmark配置。
  profile_training_timing: false
  early_stopping_patience: 0

device_args:
  using_gpu: true
  require_cuda: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_centralized_strong_transe_cuda"
  result_root: "results"
