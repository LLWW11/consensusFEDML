common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 256
  distance_norm: 1

train_args:
  # 阶段3只验证逐行计数聚合链路和短期趋势，不用于最终MRR。
  federated_optimizer: "DynamicTopologyTransE"
  comparison_scenario: "V3-HFLSnF37-Row-Count-Benchmark"
  client_num_in_total: 37
  client_num_per_round: 37
  topology_type: "matlab"
  topology_architecture: "hfl"
  topology_snf: true
  topology_edge_mode: "dynamic"
  topology_util: 0.5
  dynamic_group_mat_file: "matlab/result-U-6fixedge_epoch200_varAlpha_0p5_trainable.mat"
  aggregation_mode: "row_count_weighted"
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 9.0
  adversarial_temperature: 1.0
  expected_partition_hash: "8bcac64b705ec2db8721de6a36130625a460c11e0da46e2c22bd852ff015fb19"
  expected_topology_schedule_hash: "4df560f2d0ee2351cf93722378db18bf6f236546e91312cb2b44f3359670e2d4"
  comm_round: 5
  epochs: 2
  batch_size: 1024
  client_optimizer: "adam"
  learning_rate: 0.00005
  lr: 0.00005
  margin: 1.0
  negative_sample_count: 256
  eval_every: 5
  validation_max_triples: 512
  validation_selection: "relation_stratified"
  final_validation_max_triples: 512
  test_max_triples: 512
  evaluation_query_batch_size: 64
  evaluation_candidate_batch_size: 8192
  profile_training_timing: false
  centralized_reference_mrr: 0.3869668845438231

device_args:
  using_gpu: true
  require_cuda: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_v3_benchmark_hflsnf37_row_count_cuda"
  result_root: "results"
