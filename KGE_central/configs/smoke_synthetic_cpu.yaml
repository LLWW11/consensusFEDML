common_args:
  random_seed: 42

data_args:
  dataset: "synthetic-kg"
  # The synthetic dataset is generated in memory.
  data_dir: "data"

model_args:
  model: "transe"
  embedding_dim: 16
  distance_norm: 1

train_args:
  local_objective: "bidirectional_self_adversarial"
  fede_gamma: 6.0
  adversarial_temperature: 1.0
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  lr: 0.001
  margin: 1.0
  negative_sample_count: 4
  eval_every: 1
  validation_max_triples: 0
  validation_selection: "relation_stratified"
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_query_batch_size: 2
  evaluation_candidate_batch_size: 16
  profile_training_timing: false
  early_stopping_patience: 0

device_args:
  using_gpu: false
  require_cuda: false
  gpu_id: 0

tracking_args:
  run_name: "kge_central_smoke_synthetic_cpu"
  result_root: "results"
