common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "mnist"
  data_cache_dir: MNIST
  partition_method: "hetero"
  partition_alpha: 0.2
  split_policy: "non-iid"

model_args:
  model: "cnn"

train_args:
  federated_optimizer: "HierarchicalFL"
  client_id_list: "[]"
  client_num_in_total: 250
  client_num_per_round: 37
  fixed_candidate_client_ids: [123, 124, 125, 126, 127, 128, 41, 42, 43, 44, 45, 46, 0, 1, 2, 3, 4, 5, 164, 165, 166, 167, 168, 169, 82, 83, 84, 85, 86, 87, 205, 206, 207, 208, 209, 210, 129]  # Fixed MAT slot order shared by all MNIST scenarios.
  comm_round: 200
  epochs: 1
  batch_size: 20
  client_optimizer: sgd
  learning_rate: 0.03
  weight_decay: 0.001
  group_method: "matlab"
  group_num: 6
  dynamic_group_mat_file: "matlab/result-U-6fixedge_epoch200_varAlpha_0p1_trainable.mat"
  topology_architecture: "hfl"
  topology_snf: true
  topology_edge_mode: "fixed"
  topology_util: 0.6
  topology_assignment_mode: "balanced_counts"  # Ignore concrete MAT client identities and balance continuous candidate segments.
  experiment_tag: "full250"
  group_comm_round: 1
  model_distribution_scope: "all"  # Distribute the cloud model to all 250 clients after every epoch.
  lr: 0.001

validation_args:
  frequency_of_the_test: 1
  enable_consensus_probe: true
  probe_output_format: "npz"
  probe_source: "test"
  probe_samples_per_class: 10
  probe_seed: 0
  probe_inference_batch_size: 100
  probe_checkpoint_interval: 10
  probe_npz_file: "probe_probabilities.npz"
  probe_summary_file: "probe_epoch_summary.csv"

device_args:
  using_gpu: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  wandb_key: ""
  wandb_entity: fedml-ai
  wandb_project: simulation
  run_name: hfl_snf_fixed_u05
  using_mlops: false
