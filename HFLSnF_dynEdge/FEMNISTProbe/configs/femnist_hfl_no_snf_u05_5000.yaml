common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "femnist"
  data_cache_dir: "dataset/FEMNIST"
  candidate_seed: 0
  client_num_in_total: 37
  client_num_per_round: 37

model_args:
  model: "cnn"

train_args:
  client_optimizer: "sgd"
  comm_round: 5000
  batch_size: 20
  learning_rate: 0.001
  lr: 0.001
  topology_repeat_mode: "cycle"
  dynamic_group_mat_file: "matlab/result-U-6fixedge_epoch200_varAlpha_0p1_trainable.mat"
  topology_architecture: "hfl"
  topology_snf: false
  topology_edge_mode: "fixed"
  topology_util: 0.5

validation_args:
  eval_interval: 50
  checkpoint_interval: 50
  probe_samples_per_class: 10
  probe_seed: 0
  probe_compression_level: 4

experiment_args:
  experiment_tag: "formal5000"
  result_root: "result/FEMNISTProbe"
  resume_checkpoint: ""

acceleration_args:
  amp_enabled: true
  gpu_memory_reserve_mb: 2048
  gpu_monitor_interval: 30

device_args:
  # Use the first visible GPU.
  using_gpu: true
  gpu_id: 0
