name: femnist-probe-py37-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Keep the legacy runtime required by the existing project.
  - python=3.7
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - pytorch-cuda=11.7
  - numpy=1.21
  - scipy
  - h5py
  - pyyaml
  - pandas
  - matplotlib
  - pip
  - pip:
      # Keep the project-compatible FedML release.
      - fedml==0.7.600
      - pynvml
