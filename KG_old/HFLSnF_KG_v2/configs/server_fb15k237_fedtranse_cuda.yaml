common_args:
  training_type: "simulation"
  random_seed: 42

data_args:
  dataset: "fb15k-237"
  data_dir: "data/FB15k-237"
  partition_strategy: "balanced_head_entity"

model_args:
  model: "transe"
  embedding_dim: 128
  distance_norm: 1

train_args:
  federated_optimizer: "FedAvgTransE"
  client_num_in_total: 37
  client_num_per_round: 37
  comm_round: 100
  epochs: 1
  batch_size: 1024
  client_optimizer: "adam"
  learning_rate: 0.001
  lr: 0.001
  margin: 1.0
  negative_sample_count: 1
  eval_every: 10
  validation_max_triples: 1000
  final_validation_max_triples: 0
  test_max_triples: 0
  evaluation_candidate_batch_size: 4096
  centralized_reference_mrr: 0.19557177000249226

device_args:
  using_gpu: true
  gpu_id: 0
  require_cuda: true

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: false
  using_mlops: false
  run_name: "hflsnf_kg_fb15k237_fedtranse_server_cuda"
  result_root: "results"
